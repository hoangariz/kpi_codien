[program:kpicodien]
directory=/www/wwwroot/kpicodien
command=/www/wwwroot/kpicodien/venv/bin/gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.main:app -b 127.0.0.1:8000 --timeout 300
user=www
autostart=true
autorestart=true
startsecs=5
redirect_stderr=true
stdout_logfile=/www/wwwroot/kpicodien/logs/supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PYTHONPATH="/www/wwwroot/kpicodien"
