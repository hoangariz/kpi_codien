server {
    listen 80;
    server_name kpicodien.vcc.vn; # Thay bằng domain hoặc IP của bạn

    # Thư mục chứa bản build frontend React Vite
    root /www/wwwroot/kpicodien/frontend/dist;
    index index.html;

    # Kích hoạt Gzip nén dữ liệu truyền tải
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Tối ưu kích thước file upload cho Excel 100k dòng (~50MB - 100MB)
    client_max_body_size 100M;
    client_body_timeout 300s;

    # 1. Reverse proxy các request /api/* sang Gunicorn/FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho xử lý import nặng
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 2. Caching lâu dài cho các static assets có hash (JS, CSS, fonts, SVG)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Phục vụ Single Page Application (SPA React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/kpicodien.access.log;
    error_log /www/wwwlogs/kpicodien.error.log;
}
